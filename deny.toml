[licenses]
# BSD-3-Clause: permissive, AGPL-compatible; needed by encoding_rs (via lopdf, shipped).
allow = ["AGPL-3.0-only", "MIT", "Apache-2.0", "Unicode-3.0", "BSD-3-Clause"]

# jpeg-encoder is used only by the dev-only staple-bench crate (publish = false).
[[licenses.exceptions]]
name = "jpeg-encoder"
allow = ["IJG"]

[advisories]
# ttf-parser: "unmaintained" only, no vulnerability, no patched version. A required lopdf
# dependency, used only by lopdf's FontData (font embedding), which staple never calls.
# Revisit if lopdf replaces it or staple starts embedding fonts.
ignore = ["RUSTSEC-2026-0192"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
