name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-deny
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - name: cargo deny check
        run: cargo deny check
      - name: Build WASM crate
        run: cargo build -p staple-wasm --target wasm32-unknown-unknown

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned Rust toolchain
        working-directory: .
        run: rustup toolchain install
      - name: Check wasm-bindgen-cli pin matches Cargo.lock
        working-directory: .
        run: |
          locked=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/[^0-9.]/,"",$0); print; exit}' Cargo.lock)
          pinned=$(grep -oP 'wasm-bindgen-cli@\K[0-9.]+' .github/workflows/ci.yml | head -1)
          [ "$locked" = "$pinned" ] || { echo "wasm-bindgen-cli pin ($pinned) != Cargo.lock ($locked): update ci.yml"; exit 1; }
      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          # Must match the wasm-bindgen version in Cargo.lock.
          tool: wasm-bindgen-cli@0.2.130
      - name: npm ci
        run: npm ci
      - name: npm run lint
        run: npm run lint
      - name: npm test
        run: npm test
      - name: npm run build
        run: npm run build
      # Keep this before the e2e step: `vite build --mode e2e` overwrites web/dist with the window.staple hook, which must not ship.
      - name: Upload build for deploy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
      # Guards the worker lazy-load and application/wasm MIME ACs.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: npm run test:e2e
        run: npm run test:e2e

  # Header and browser checks run after `wrangler deploy` is live: a regression ships before it is flagged, and there is no rollback step (accepted by the plan).
  # Main only (never on pull requests). Needs secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
  deploy:
    needs: [rust, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - name: Deploy to Cloudflare
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[^ ]+\.workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || { echo "no deployed URL in wrangler output"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed URL: $url"
      - name: Assert security headers
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          fail=0
          for path in / /merge; do
            headers=$(curl -sSIL "$URL$path")
            for want in \
              "content-security-policy:.*default-src 'self'" \
              "content-security-policy:.*connect-src 'self'" \
              "content-security-policy:.*script-src 'self' 'wasm-unsafe-eval'" \
              "content-security-policy:.*object-src 'none'" \
              "content-security-policy:.*base-uri 'none'" \
              "content-security-policy:.*frame-ancestors 'none'" \
              "cross-origin-opener-policy: same-origin" \
              "cross-origin-embedder-policy: require-corp"; do
              echo "$headers" | grep -qiE "^$want" || { echo "MISSING on $path: $want"; fail=1; }
            done
          done
          exit $fail
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser check on deployed site
        env:
          E2E_BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npm run test:e2e:deployed
