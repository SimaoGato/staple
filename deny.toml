[licenses]
allow = ["AGPL-3.0-only", "MIT", "Apache-2.0", "Unicode-3.0"]

# jpeg-encoder is used only by the dev-only staple-bench crate (publish = false).
[[licenses.exceptions]]
name = "jpeg-encoder"
allow = ["IJG"]

# encoding_rs (via lopdf, shipped) is "(Apache-2.0 OR MIT) AND BSD-3-Clause": permissive,
# AGPL-compatible; allowed for this crate only so the global allowlist stays narrow.
[[licenses.exceptions]]
name = "encoding_rs"
allow = ["BSD-3-Clause"]

[advisories]
# ttf-parser is unmaintained (no vulnerability), pulled in by lopdf; revisit in EPIC-05.
ignore = ["RUSTSEC-2026-0192"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
